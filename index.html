<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tracker Yape</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería ligera para arrastrar y soltar categorías táctil -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    body { overscroll-behavior-y: none; }
    .no-select { user-select: none; -webkit-user-select: none; }
    ::-webkit-scrollbar { display: none; width: 0px; background: transparent; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .wheel-container {
      mask-image: linear-gradient(to bottom, transparent, black 40%, black 60%, transparent);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 40%, black 60%, transparent);
    }
    .wheel-col {
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }
    .wheel-item {
      scroll-snap-align: center;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%; /* Forzar centrado absoluto */
    }
    
    .modal-overlay {
      transition: opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .action-sheet {
      transition: transform 0.3s ease;
      transform: translateY(100%);
    }
    .action-sheet.active {
      transform: translateY(0);
    }
  </style>
</head>
<body class="bg-gray-100 h-screen w-screen overflow-hidden font-sans text-gray-800 no-select flex flex-col">

  <!-- Header Principal -->
  <header class="bg-purple-600 text-white p-4 flex justify-between items-center shadow-md relative z-10 shrink-0">
    <div class="flex items-center gap-3">
      <button id="btn-menu" class="p-2 -ml-2"><span class="text-2xl">☰</span></button>
      <h1 class="text-xl font-bold">Gastos Yape</h1>
    </div>
    <button id="btn-export" class="flex items-center gap-2 bg-purple-700 px-3 py-1 rounded-lg text-sm font-semibold">
      <span>↓ CSV</span>
    </button>
  </header>

  <!-- Historial Principal y Balance -->
  <main id="main-view" class="flex-1 overflow-y-auto pb-24 px-4 pt-4 relative z-0 flex flex-col">
    
    <!-- Balance General -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-5 flex justify-between items-center shrink-0">
      <div class="w-1/2 text-center border-r border-gray-100">
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Recibido</p>
        <p id="balance-in" class="text-xl font-bold text-green-600">S/0.00</p>
      </div>
      <div class="w-1/2 text-center">
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Pagado</p>
        <p id="balance-out" class="text-xl font-bold text-red-600">S/0.00</p>
      </div>
    </div>

    <div id="empty-state" class="text-center text-gray-400 mt-10 hidden flex-col items-center">
      <div class="text-4xl mb-2">💸</div>
      <p>No hay gastos registrados aún</p>
    </div>
    
    <ul id="history-list" class="space-y-3"></ul>
  </main>

  <!-- Menú Lateral (Sidebar) -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden opacity-0 transition-opacity"></div>
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white z-50 transform -translate-x-full transition-transform duration-300 shadow-2xl flex flex-col">
    <div class="p-6 bg-purple-600 text-white">
      <h2 class="text-2xl font-bold">Menú</h2>
    </div>
    <nav class="flex-1 p-4 space-y-2">
      <button id="nav-home" class="w-full text-left p-3 rounded-lg bg-purple-100 text-purple-700 font-semibold">Inicio</button>
      <button id="nav-categories" class="w-full text-left p-3 rounded-lg hover:bg-gray-100 text-gray-700 font-semibold">Categorías</button>
    </nav>
    <div class="p-4 border-t">
      <button id="btn-clear-all" class="w-full p-3 text-red-600 font-semibold rounded-lg hover:bg-red-50 text-left">🗑️ Limpiar Historial</button>
    </div>
  </aside>

  <!-- Vista de Categorías -->
  <div id="categories-view" class="fixed inset-0 top-16 bg-gray-50 z-20 hidden flex-col">
    <div class="p-4 flex-1 overflow-y-auto pb-24">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-gray-500 font-semibold uppercase text-xs tracking-wider">Tus Categorías</h3>
        <span class="text-gray-400 text-[10px] uppercase font-bold flex items-center gap-1">↕️ Arrastrar para ordenar</span>
      </div>
      <ul id="categories-list" class="bg-white rounded-xl shadow-sm border border-gray-100 divide-y divide-gray-100"></ul>
    </div>
    <button id="btn-add-category" class="absolute bottom-6 right-6 w-14 h-14 bg-purple-600 rounded-full shadow-lg text-white text-3xl flex items-center justify-center hover:bg-purple-700">+</button>
  </div>

  <!-- Botón Flotante Principal -->
  <button id="btn-add-expense" class="fixed bottom-6 right-6 w-14 h-14 bg-purple-600 rounded-full shadow-lg text-white text-3xl flex items-center justify-center z-10 hover:bg-purple-700 shadow-purple-500/50">+</button>

  <!-- Modal Interactivo iOS (Ingreso de Gasto) -->
  <div id="expense-modal-overlay" class="fixed inset-0 bg-black/60 z-50 flex justify-center items-center opacity-0 pointer-events-none transition-opacity duration-300 modal-overlay">
    <div id="expense-modal" class="bg-white w-11/12 max-w-sm rounded-3xl p-6 shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col">
      <div class="flex justify-between items-center mb-6">
        <button id="btn-close-modal" class="text-gray-400 text-xl font-bold p-2">✕</button>
        <h2 class="text-lg font-bold text-gray-800">Registrar</h2>
        <div class="w-8"></div>
      </div>
      
      <!-- Contador Gigante Dinámico -->
      <div id="display-container" class="text-center mb-8 text-red-600 transition-colors duration-300 flex justify-center items-center w-full">
        <span class="text-5xl font-bold tracking-tighter" id="display-sign">-</span>
        <span class="text-5xl font-bold tracking-tighter">S/</span>
        <span class="text-5xl font-bold tracking-tighter" id="display-soles">0</span>
        <span class="text-5xl font-bold tracking-tighter" id="display-dot">.</span>
        <span class="text-5xl font-bold tracking-tighter" id="display-cents">00</span>
      </div>

      <!-- Selector de Ruedas -->
      <div class="relative h-44 bg-gray-50 rounded-2xl overflow-hidden mb-6 px-4">
        <div class="absolute top-1/2 left-0 w-full h-14 bg-gray-200/50 transform -translate-y-1/2 pointer-events-none border-y border-gray-300/50"></div>
        <div class="wheel-container flex h-full justify-between items-center relative z-10 text-center">
          <div id="wheel-soles" class="wheel-col w-1/3 h-full overflow-y-auto no-scrollbar pt-[42px] pb-[42px]"></div>
          <div id="wheel-cents" class="wheel-col w-1/3 h-full overflow-y-auto no-scrollbar pt-[42px] pb-[42px]"></div>
          <div id="wheel-type" class="wheel-col w-1/3 h-full overflow-y-auto no-scrollbar pt-[42px] pb-[42px]">
            <div class="wheel-item text-xl font-medium text-red-600 w-full text-center" data-val="Pagado">Pagado</div>
            <div class="wheel-item text-xl font-medium text-green-600 w-full text-center" data-val="Recibido">Recibido</div>
          </div>
        </div>
      </div>

      <!-- Selector de Concepto -->
      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-500 mb-2">Concepto</label>
        <div class="relative">
          <select id="select-category" class="w-full appearance-none bg-gray-100 border-none rounded-xl py-3 px-4 text-gray-800 font-medium focus:ring-2 focus:ring-purple-500 outline-none text-center">
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">▼</div>
        </div>
      </div>

      <button id="btn-save" class="w-full bg-purple-600 text-white font-bold py-4 rounded-xl shadow-md hover:bg-purple-700 active:scale-95 transition-all text-lg">
        Guardar
      </button>
    </div>
  </div>

  <!-- Action Sheet (Gastos y Categorías) -->
  <div id="action-sheet-overlay" class="fixed inset-0 bg-black/50 z-50 hidden opacity-0 transition-opacity">
    <div id="action-sheet" class="absolute bottom-0 left-0 w-full bg-white rounded-t-3xl p-6 action-sheet pb-8">
      <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-6"></div>
      <button id="action-edit" class="w-full py-4 text-lg font-semibold text-gray-800 border-b border-gray-100 flex items-center justify-center gap-2">
        ✏️ Editar
      </button>
      <button id="action-delete" class="w-full py-4 text-lg font-semibold text-red-600 flex items-center justify-center gap-2">
        🗑️ Eliminar
      </button>
    </div>
  </div>

  <!-- Custom Dialog Modals (Corregido para centrado absoluto) -->
  <div id="custom-dialog" class="fixed inset-0 bg-black/60 z-[60] hidden opacity-0 transition-opacity">
    <div class="flex items-center justify-center min-h-screen px-4">
      <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl transform scale-95 transition-transform duration-200">
        <h3 id="dialog-title" class="text-lg font-bold text-gray-800 mb-2"></h3>
        <p id="dialog-message" class="text-gray-500 text-sm mb-4 hidden"></p>
        <input type="text" id="dialog-input" class="w-full bg-gray-100 border border-gray-200 rounded-lg p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-500 mb-4 hidden" autocomplete="off">
        <div class="flex justify-end gap-3 mt-2">
          <button id="btn-dialog-cancel" class="px-4 py-2 text-gray-500 font-semibold rounded-lg hover:bg-gray-100">Cancelar</button>
          <button id="btn-dialog-confirm" class="px-4 py-2 bg-purple-600 text-white font-semibold rounded-lg hover:bg-purple-700">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let transactions = JSON.parse(localStorage.getItem('yape_transactions')) || [];
      let categories = JSON.parse(localStorage.getItem('yape_categories')) || [
        { id: '1', name: '🍔 Comida' },
        { id: '2', name: '🚗 Transporte' },
        { id: '3', name: '🛒 Compras' },
        { id: '4', name: '💡 Servicios' }
      ];
      let editingId = null;
      let activeActionItem = null;
      let actionContext = 'expense';

      const els = {
        mainView: document.getElementById('main-view'),
        catView: document.getElementById('categories-view'),
        historyList: document.getElementById('history-list'),
        catList: document.getElementById('categories-list'),
        emptyState: document.getElementById('empty-state'),
        selectCat: document.getElementById('select-category'),
        modalOverlay: document.getElementById('expense-modal-overlay'),
        modal: document.getElementById('expense-modal'),
        sheetOverlay: document.getElementById('action-sheet-overlay'),
        sheet: document.getElementById('action-sheet'),
        sidebarOverlay: document.getElementById('sidebar-overlay'),
        sidebar: document.getElementById('sidebar'),
        dispSoles: document.getElementById('display-soles'),
        dispCents: document.getElementById('display-cents'),
        dispSign: document.getElementById('display-sign'),
        dispContainer: document.getElementById('display-container'),
        wSoles: document.getElementById('wheel-soles'),
        wCents: document.getElementById('wheel-cents'),
        wType: document.getElementById('wheel-type'),
        dialog: document.getElementById('custom-dialog'),
        dialogTitle: document.getElementById('dialog-title'),
        dialogMessage: document.getElementById('dialog-message'),
        dialogInput: document.getElementById('dialog-input'),
        btnDialogConfirm: document.getElementById('btn-dialog-confirm'),
        btnDialogCancel: document.getElementById('btn-dialog-cancel')
      };

      let dialogCallback = null;
      
      function showCustomDialog({ title, message = '', input = false, inputValue = '', confirmText = 'Aceptar', confirmColor = 'bg-purple-600', onConfirm }) {
        els.dialogTitle.textContent = title;
        if (message) {
          els.dialogMessage.textContent = message;
          els.dialogMessage.classList.remove('hidden');
        } else {
          els.dialogMessage.classList.add('hidden');
        }
        if (input) {
          els.dialogInput.value = inputValue;
          els.dialogInput.classList.remove('hidden');
        } else {
          els.dialogInput.classList.add('hidden');
        }
        els.btnDialogConfirm.className = `px-4 py-2 text-white font-semibold rounded-lg ${confirmColor}`;
        els.btnDialogConfirm.textContent = confirmText;
        dialogCallback = onConfirm;

        els.dialog.classList.remove('hidden');
        setTimeout(() => {
          els.dialog.classList.remove('opacity-0');
          els.dialog.querySelector('.transform').classList.remove('scale-95');
          if (input) els.dialogInput.focus();
        }, 10);
      }

      function closeCustomDialog() {
        els.dialog.classList.add('opacity-0');
        els.dialog.querySelector('.transform').classList.add('scale-95');
        setTimeout(() => {
          els.dialog.classList.add('hidden');
          dialogCallback = null;
        }, 200);
      }

      els.btnDialogCancel.addEventListener('click', closeCustomDialog);
      els.btnDialogConfirm.addEventListener('click', () => {
        if (dialogCallback) {
          const val = els.dialogInput.classList.contains('hidden') ? true : els.dialogInput.value.trim();
          dialogCallback(val);
        }
        closeCustomDialog();
      });

      function initWheels() {
        els.wSoles.innerHTML = '';
        els.wCents.innerHTML = '';
        for(let i = 0; i <= 999; i++) {
          let div = document.createElement('div');
          div.className = 'wheel-item text-3xl font-bold w-full text-center flex justify-center items-center';
          div.dataset.val = i;
          div.textContent = i;
          els.wSoles.appendChild(div);
        }
        for(let i = 0; i <= 90; i+=10) {
          let div = document.createElement('div');
          div.className = 'wheel-item text-3xl font-bold w-full text-center flex justify-center items-center';
          let v = i === 0 ? '00' : i;
          div.dataset.val = v;
          div.textContent = v;
          els.wCents.appendChild(div);
        }
      }

      function updateDisplay() {
        const getCenterVal = (el) => {
          const center = el.scrollTop + (el.clientHeight / 2);
          const items = Array.from(el.children);
          let closest = items[0];
          let minDist = Infinity;
          items.forEach(item => {
            const dist = Math.abs(item.offsetTop + (item.clientHeight / 2) - center);
            if (dist < minDist) { minDist = dist; closest = item; }
          });
          return closest ? closest.dataset.val : null;
        };

        const soles = getCenterVal(els.wSoles) || '0';
        const cents = getCenterVal(els.wCents) || '00';
        const type = getCenterVal(els.wType) || 'Pagado';

        els.dispSoles.textContent = soles;
        els.dispCents.textContent = cents;

        if (type === 'Pagado') {
          els.dispContainer.className = 'text-center mb-8 text-red-600 transition-colors duration-300 flex justify-center items-center w-full';
          els.dispSign.textContent = '-';
        } else {
          els.dispContainer.className = 'text-center mb-8 text-green-600 transition-colors duration-300 flex justify-center items-center w-full';
          els.dispSign.textContent = '+';
        }
      }

      function scrollEndListener(e) {
        clearTimeout(e.target.scrollTimeout);
        e.target.scrollTimeout = setTimeout(updateDisplay, 50);
      }
      els.wSoles.addEventListener('scroll', scrollEndListener);
      els.wCents.addEventListener('scroll', scrollEndListener);
      els.wType.addEventListener('scroll', scrollEndListener);

      function setWheelValue(wheel, value) {
        const items = Array.from(wheel.children);
        const target = items.find(item => item.dataset.val == value);
        if (target) {
          wheel.scrollTop = target.offsetTop - (wheel.clientHeight / 2) + (target.clientHeight / 2);
        }
      }

      function renderCategories() {
        els.selectCat.innerHTML = categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        els.catList.innerHTML = categories.map((c, idx) => `
          <li class="p-4 flex items-center justify-between active:bg-gray-50 bg-white" data-id="${c.id}" data-index="${idx}">
            <div class="flex items-center gap-3 w-full">
              <span class="text-gray-300 text-2xl font-bold cursor-grab active:cursor-grabbing drag-handle px-2 -ml-2">☰</span>
              <span class="text-lg font-medium text-gray-800 flex-1 truncate">${c.name}</span>
            </div>
            <span class="text-gray-400 text-xl px-4 py-2 -mr-4 cursor-pointer btn-cat-opts" data-id="${c.id}">⋮</span>
          </li>
        `).join('');

        document.querySelectorAll('.btn-cat-opts').forEach(btn => {
          btn.addEventListener('click', (e) => {
            openActionSheet(btn.dataset.id, 'category');
          });
        });
      }

      function formatTime(dateObj) {
        let h = dateObj.getHours();
        let m = dateObj.getMinutes().toString().padStart(2, '0');
        let ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12; h = h ? h : 12; 
        return `${h}:${m} ${ampm}`;
      }

      function renderHistory() {
        els.historyList.innerHTML = '';
        
        let tIn = 0;
        let tOut = 0;

        if (transactions.length === 0) {
          els.emptyState.classList.remove('hidden');
          els.emptyState.classList.add('flex');
        } else {
          els.emptyState.classList.add('hidden');
          els.emptyState.classList.remove('flex');
          
          const sorted = [...transactions].sort((a,b) => b.timestamp - a.timestamp);
          sorted.forEach(t => {
            if(t.type === 'Recibido') tIn += parseFloat(t.amount);
            if(t.type === 'Pagado') tOut += parseFloat(t.amount);
            
            const isPagado = t.type === 'Pagado';
            const colorClass = isPagado ? 'text-red-600' : 'text-green-600';
            const sign = isPagado ? '-' : '+';
            const date = new Date(t.timestamp);
            const timeStr = formatTime(date);
            const emojiMatch = t.category.match(/^(\p{Emoji})/u);
            const emoji = emojiMatch ? emojiMatch[1] : '🏷️';
            const catName = emojiMatch ? t.category.replace(emoji, '').trim() : t.category;

            els.historyList.insertAdjacentHTML('beforeend', `
              <li class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between active:scale-[0.98] transition-transform cursor-pointer history-item" data-id="${t.id}">
                <div class="flex items-center gap-4">
                  <div class="w-12 h-12 rounded-full bg-gray-50 flex items-center justify-center text-2xl border border-gray-100 shrink-0">${emoji}</div>
                  <div class="truncate">
                    <h4 class="font-bold text-gray-800 truncate">${catName}</h4>
                    <p class="text-xs text-gray-400 font-medium">${date.toLocaleDateString()} • ${timeStr}</p>
                  </div>
                </div>
                <div class="text-right pl-2">
                  <p class="font-bold text-lg tracking-tight ${colorClass}">${sign}S/${t.amount}</p>
                </div>
              </li>
            `);
          });

          document.querySelectorAll('.history-item').forEach(li => {
            li.addEventListener('click', () => openActionSheet(li.dataset.id, 'expense'));
          });
        }
        
        document.getElementById('balance-in').textContent = `S/${tIn.toFixed(2)}`;
        document.getElementById('balance-out').textContent = `S/${tOut.toFixed(2)}`;
      }

      function openModal(editMode = false) {
        els.modalOverlay.classList.add('active');
        els.modal.classList.remove('scale-95');
        
        if (!editMode) {
          editingId = null;
          setWheelValue(els.wSoles, 0);
          setWheelValue(els.wCents, '00');
          setWheelValue(els.wType, 'Pagado');
        }
        setTimeout(updateDisplay, 100);
      }
      
      function closeModal() {
        els.modalOverlay.classList.remove('active');
        els.modal.classList.add('scale-95');
      }

      function openActionSheet(id, context) {
        activeActionItem = id;
        actionContext = context;
        els.sheetOverlay.classList.remove('hidden');
        setTimeout(() => {
          els.sheetOverlay.classList.add('opacity-100');
          els.sheet.classList.add('active');
        }, 10);
      }

      function closeActionSheet() {
        els.sheet.classList.remove('active');
        els.sheetOverlay.classList.remove('opacity-100');
        setTimeout(() => {
          els.sheetOverlay.classList.add('hidden');
        }, 300);
      }

      els.sheetOverlay.addEventListener('click', (e) => {
        if(e.target === els.sheetOverlay) closeActionSheet();
      });

      document.getElementById('action-edit').addEventListener('click', () => {
        closeActionSheet();
        if (actionContext === 'expense') {
          const t = transactions.find(x => x.id === activeActionItem);
          if (t) {
            editingId = t.id;
            const [s, c] = t.amount.split('.');
            setWheelValue(els.wSoles, parseInt(s));
            setWheelValue(els.wCents, c);
            setWheelValue(els.wType, t.type);
            els.selectCat.value = t.category;
            openModal(true);
          }
        } else if (actionContext === 'category') {
          const cat = categories.find(x => x.id === activeActionItem);
          if (cat) {
            showCustomDialog({
              title: 'Editar Categoría',
              input: true,
              inputValue: cat.name,
              onConfirm: (newName) => {
                if (newName && newName !== cat.name) {
                  transactions = transactions.map(t => t.category === cat.name ? {...t, category: newName} : t);
                  cat.name = newName;
                  saveData();
                }
              }
            });
          }
        }
      });

      document.getElementById('action-delete').addEventListener('click', () => {
        closeActionSheet();
        if (actionContext === 'expense') {
          showCustomDialog({
            title: '¿Eliminar Gasto?',
            message: 'Esta acción no se puede deshacer.',
            confirmText: 'Eliminar',
            confirmColor: 'bg-red-600 hover:bg-red-700',
            onConfirm: () => {
              transactions = transactions.filter(x => x.id !== activeActionItem);
              saveData();
            }
          });
        } else if (actionContext === 'category') {
          const cat = categories.find(x => x.id === activeActionItem);
          const isUsed = transactions.some(t => t.category === cat.name);
          
          if (isUsed) {
            showCustomDialog({
              title: 'Acción Bloqueada',
              message: `No puedes eliminar la categoría "${cat.name}" porque ya tiene gastos asignados en tu historial.`,
              confirmText: 'Entendido'
            });
          } else {
            showCustomDialog({
              title: '¿Eliminar Categoría?',
              message: `Se borrará la categoría "${cat.name}".`,
              confirmText: 'Eliminar',
              confirmColor: 'bg-red-600 hover:bg-red-700',
              onConfirm: () => {
                categories = categories.filter(x => x.id !== activeActionItem);
                saveData();
              }
            });
          }
        }
      });

      function toggleSidebar() {
        const isHidden = els.sidebarOverlay.classList.contains('hidden');
        if (isHidden) {
          els.sidebarOverlay.classList.remove('hidden');
          setTimeout(() => {
            els.sidebarOverlay.classList.add('opacity-100');
            els.sidebar.classList.remove('-translate-x-full');
          }, 10);
        } else {
          els.sidebar.classList.add('-translate-x-full');
          els.sidebarOverlay.classList.remove('opacity-100');
          setTimeout(() => els.sidebarOverlay.classList.add('hidden'), 300);
        }
      }
      
      els.sidebarOverlay.addEventListener('click', toggleSidebar);
      document.getElementById('btn-menu').addEventListener('click', toggleSidebar);

      function switchView(view) {
        toggleSidebar();
        if(view === 'home') {
          els.mainView.classList.remove('hidden');
          els.catView.classList.add('hidden');
          document.getElementById('nav-home').className = 'w-full text-left p-3 rounded-lg bg-purple-100 text-purple-700 font-semibold';
          document.getElementById('nav-categories').className = 'w-full text-left p-3 rounded-lg hover:bg-gray-100 text-gray-700 font-semibold';
        } else {
          els.mainView.classList.add('hidden');
          els.catView.classList.remove('hidden');
          els.catView.classList.add('flex');
          document.getElementById('nav-categories').className = 'w-full text-left p-3 rounded-lg bg-purple-100 text-purple-700 font-semibold';
          document.getElementById('nav-home').className = 'w-full text-left p-3 rounded-lg hover:bg-gray-100 text-gray-700 font-semibold';
        }
      }

      document.getElementById('nav-home').addEventListener('click', () => switchView('home'));
      document.getElementById('nav-categories').addEventListener('click', () => switchView('cat'));

      document.getElementById('btn-add-expense').addEventListener('click', () => openModal(false));
      document.getElementById('btn-close-modal').addEventListener('click', closeModal);

      document.getElementById('btn-add-category').addEventListener('click', () => {
        showCustomDialog({
          title: 'Nueva Categoría',
          input: true,
          confirmText: 'Guardar',
          onConfirm: (name) => {
            if (name) {
              categories.push({ id: Date.now().toString(), name });
              saveData();
            }
          }
        });
      });

      document.getElementById('btn-clear-all').addEventListener('click', () => {
        toggleSidebar();
        showCustomDialog({
          title: '¿Limpiar todo el historial?',
          message: 'Se borrarán permanentemente todos los gastos registrados.',
          confirmText: 'Borrar Todo',
          confirmColor: 'bg-red-600 hover:bg-red-700',
          onConfirm: () => {
            transactions = [];
            saveData();
          }
        });
      });

      document.getElementById('btn-save').addEventListener('click', () => {
        const amount = `${els.dispSoles.textContent}.${els.dispCents.textContent}`;
        if (amount === "0.00") return;
        
        const type = els.dispContainer.classList.contains('text-green-600') ? 'Recibido' : 'Pagado';
        const category = els.selectCat.value;

        if (editingId) {
          const tIndex = transactions.findIndex(x => x.id === editingId);
          if (tIndex > -1) {
            transactions[tIndex].amount = amount;
            transactions[tIndex].type = type;
            transactions[tIndex].category = category;
          }
        } else {
          transactions.push({
            id: Date.now().toString(),
            amount,
            type,
            category,
            timestamp: Date.now()
          });
        }
        saveData();
        closeModal();
      });

      document.getElementById('btn-export').addEventListener('click', () => {
        if (transactions.length === 0) return;
        let csvContent = "data:text/csv;charset=utf-8,Fecha,Hora,Tipo,Concepto,Monto\n";
        
        const sorted = [...transactions].sort((a,b) => b.timestamp - a.timestamp);
        sorted.forEach(t => {
          const d = new Date(t.timestamp);
          const row = [
            d.toLocaleDateString(),
            formatTime(d),
            t.type,
            `"${t.category}"`,
            t.amount
          ].join(",");
          csvContent += row + "\n";
        });
        
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `gastos_yape_${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });

      function saveData() {
        localStorage.setItem('yape_transactions', JSON.stringify(transactions));
        localStorage.setItem('yape_categories', JSON.stringify(categories));
        renderCategories();
        renderHistory();
      }

      initWheels();
      renderCategories();
      renderHistory();
      
      // Inicializar drag and drop para categorías
      Sortable.create(els.catList, {
        handle: '.drag-handle',
        animation: 150,
        onEnd: function (evt) {
          const item = categories.splice(evt.oldIndex, 1)[0];
          categories.splice(evt.newIndex, 0, item);
          saveData();
        }
      });
      
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(()=>{});
      }

      // Asegurar apertura inicial dando tiempo al renderizado de la UI
      setTimeout(() => openModal(false), 400);
    });
  </script>
</body>
</html>
